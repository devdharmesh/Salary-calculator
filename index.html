<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Salary Calculator</h1>
            <p>Calculate your final monthly salary after unpaid leave deductions</p>
            <p class="calculation-info">Note: Paid leave reduces unpaid leave deduction. If unpaid leave ≤ paid leave, no deduction is made.</p>
        </header>

        <main>
            <form id="salaryForm" class="calculator-form">
                <div class="form-group">
                    <label for="grossSalary">Gross Monthly Salary</label>
                    <input 
                        type="number" 
                        id="grossSalary" 
                        name="grossSalary" 
                        min="0" 
                        step="0.01" 
                        placeholder="Enter gross monthly salary"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="paidLeave">Paid Leave (days)</label>
                    <input 
                        type="number" 
                        id="paidLeave" 
                        name="paidLeave" 
                        min="0" 
                        step="0.01" 
                        value="1"
                        placeholder="Enter paid leave days"
                    >
                </div>

                <div class="form-group">
                    <label for="unpaidLeave">Unpaid Leave (days)</label>
                    <input 
                        type="number" 
                        id="unpaidLeave" 
                        name="unpaidLeave" 
                        min="0" 
                        step="0.01" 
                        placeholder="Enter unpaid leave days"
                    >
                </div>

                <div class="form-group">
                    <label for="daysInMonth">Days in Month</label>
                    <input 
                        type="number" 
                        id="daysInMonth" 
                        name="daysInMonth" 
                        min="28" 
                        max="31" 
                        placeholder="Enter days in month"
                        required
                    >
                </div>

                <button type="submit" class="calculate-btn">Calculate Salary</button>
            </form>

            <div id="results" class="results-section" style="display: none;">
                <h2>Calculation Results</h2>
                <div class="result-item">
                    <span class="label">Daily Salary:</span>
                    <span id="dailySalary" class="value"></span>
                </div>
                <div class="result-item">
                    <span class="label">Deduction Amount:</span>
                    <span id="deduction" class="value"></span>
                </div>
                <div class="result-item final-salary">
                    <span class="label">Final Salary:</span>
                    <span id="finalSalary" class="value"></span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
